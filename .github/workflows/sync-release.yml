name: Sync release to public repo
# Chép một bản phát hành (file cài + ghi chú + SHA256SUMS.txt) từ repo private này sang repo CÔNG KHAI để trang Store liên kết tải về.
# Chạy TỰ ĐỘNG:
#   - cuối workflow "Build executables" khi đẩy tag v* (file cài mới lên repo công khai);
#   - mỗi khi ghi chú của bản phát hành được sửa (release: edited) → ghi chú công khai được cập nhật theo.
# Vẫn chạy tay được: Actions → Sync release to public repo → Run workflow → nhập tag (vd. v0.5.7).
# Cần cấu hình một lần (xem docs/prompts/store-downloads.md):
#   - biến (Settings → Secrets and variables → Actions → Variables): RELEASES_REPO = duyminh-bostrap/MikMaster-releases
#   - secret: RELEASES_REPO_TOKEN = token GitHub (fine-grained) chỉ có quyền Contents: read & write trên repo công khai đó.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag của bản phát hành, ví dụ v0.5.7'
        required: true
  workflow_call:
    inputs:
      tag:
        type: string
        required: true
  release:
    types: [edited]

# Cùng một bản phát hành không chạy chồng lên nhau.
concurrency:
  group: sync-release-${{ inputs.tag || github.event.release.tag_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    # Sự kiện sửa ghi chú chỉ chạy khi đã cấu hình repo công khai (tránh lượt chạy đỏ vô ích).
    if: github.event_name != 'release' || vars.RELEASES_REPO != ''
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || github.event.release.tag_name }}
      MIRROR_REPO: ${{ vars.RELEASES_REPO }}
      MIRROR_TOKEN: ${{ secrets.RELEASES_REPO_TOKEN }}
    steps:
      - name: Check configuration
        run: |
          case "$TAG" in v[0-9]*.[0-9]*.[0-9]*) ;; *) echo "::error::Tag must look like v1.2.3"; exit 1 ;; esac
          if [ -z "$MIRROR_REPO" ] || [ -z "$MIRROR_TOKEN" ]; then
            echo "::error::Set the variable RELEASES_REPO and the secret RELEASES_REPO_TOKEN first"; exit 1
          fi

      - name: Download the release from this (private) repo
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir dl
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir dl
          ls -la dl
          (cd dl && sha256sum * > ../SHA256SUMS.txt) && mv SHA256SUMS.txt dl/
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json body --jq .body > notes.md
          # Đọc ở đây vì token của bước sau chỉ có quyền trên repo công khai.
          if [ "$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)" = "$TAG" ]; then echo true > latest.txt; else echo false > latest.txt; fi

      - name: Check the release notes (warnings only)
        run: |
          # Quy tắc ghi chú của trang Store (xem store/releases.md): đủ 3 mục, dưới 20.000 ký tự, không ảnh / HTML.
          for h in "### What's new" "### Fixes" "### Known issues"; do
            grep -qxF "$h" notes.md || echo "::warning::Release notes are missing the heading: $h"
          done
          [ "$(wc -m < notes.md)" -lt 20000 ] || echo "::warning::Release notes are 20,000 characters or longer"
          grep -qE '!\[|<[a-zA-Z/]' notes.md && echo "::warning::Release notes contain an image or HTML" || true

      - name: Publish to the public repo
        env:
          GH_TOKEN: ${{ secrets.RELEASES_REPO_TOKEN }}
        run: |
          # Chỉ bản mới nhất của repo private mới được đánh dấu "Latest" ở repo công khai (sửa ghi chú bản cũ không đổi điều đó).
          LATEST=$(cat latest.txt)
          if gh release view "$TAG" --repo "$MIRROR_REPO" > /dev/null 2>&1; then
            gh release edit "$TAG" --repo "$MIRROR_REPO" --title "MikMaster $TAG" --notes-file notes.md --latest="$LATEST"
          else
            gh release create "$TAG" --repo "$MIRROR_REPO" --title "MikMaster $TAG" --notes-file notes.md --latest="$LATEST"
          fi
          gh release upload "$TAG" dl/* --repo "$MIRROR_REPO" --clobber
          echo "Published: https://github.com/$MIRROR_REPO/releases/tag/$TAG"
