name: Build executables
# Windows: MikMaster-Setup.exe (bộ cài) + MikMaster.exe (bản chạy ngay, không cài).
# macOS: MikMaster.dmg. Không máy nào cần cài Node.
# Chạy tay (tab Actions → Build executables → Run workflow) hoặc khi đẩy tag v* (tạo luôn Release).
on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: MikMaster-windows-x64
            files: |
              release/MikMaster-Setup.exe
              release/MikMaster.exe
          - os: macos-latest
            artifact: MikMaster-macos-arm64
            files: release/MikMaster.dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      # Node chính thức (có "cầu chì" SEA để nhúng ứng dụng vào file chạy).
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:exe

      - name: Build the Windows installer (Inno Setup)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          $version = (Get-Content package.json | ConvertFrom-Json).version
          & $iscc "/DAppVersion=$version" build-assets\installer.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.files }}
          if-no-files-found: error
      # Ghi chú Release lấy từ docs/releases/<tag>.md nếu có; không có thì để GitHub tự sinh.
      - name: Pick release notes
        id: notes
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          file="docs/releases/${GITHUB_REF_NAME}.md"
          if [ -f "$file" ]; then echo "path=$file" >> "$GITHUB_OUTPUT"; else echo "path=" >> "$GITHUB_OUTPUT"; fi
      - if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.files }}
          body_path: ${{ steps.notes.outputs.path }}
          generate_release_notes: ${{ steps.notes.outputs.path == '' }}
